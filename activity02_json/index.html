<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON</title>

  <link rel="icon" type="image/png" href="../assets/page_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="assets/css/json.css" rel="stylesheet">
  <link href="../assets/css/desktop.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <main class="flex-grow-1 d-flex align-items-center justify-content-center px-3 py-4">
    <section class="retro-window pop-in" aria-label="activity02_json" data-icon="json_icon.png">

      <div class="retro-titlebar d-flex align-items-center gap-2">
        <span class="name flex-grow-1">activity02_json</span>
        <button type="button" class="retro-winbtn d-flex align-items-center justify-content-center" data-win="min" aria-label="Minimize">_</button>
        <button type="button" class="retro-winbtn d-flex align-items-center justify-content-center" data-win="max" aria-label="Maximize">&#9633;</button>
        <button type="button" class="retro-winbtn d-flex align-items-center justify-content-center" data-win="close" aria-label="Close">x</button>
      </div>

      <div class="retro-menubar d-flex gap-3" aria-hidden="true">
        <span>File</span><span>Edit</span><span>View</span><span>Help</span>
      </div>

      <div class="retro-toolbar d-flex align-items-center gap-2">
        <a class="btn btn-retro btn-sm" href="../index.html">&lt; Back</a>
        <span>Address</span>
        <span class="retro-path flex-grow-1 text-truncate">C:\portfolio\web_dev\activity02_json</span>
      </div>

      <div class="retro-body">
        <div class="retro-content json-wrap">
          <div class="container-fluid px-1">

            <h1 class="visually-hidden">Song of the Welkin Moon characters</h1>
            <div class="version-banner">
              <img class="version-logo" src="assets/img/songofthewelkinmoon.png" alt="Genshin Impact: Song of the Welkin Moon">
              <span class="version-fallback" hidden>Song of the Welkin Moon</span>
            </div>

            <div class="row" id="parent">

            </div>
          </div>
        </div>
      </div>

      <div class="retro-statusbar d-flex justify-content-between">
        <span id="count">0 object(s)</span>
        <span>Genshin Impact &copy; HoYoverse</span>
      </div>

    </section>
  </main>

  <footer class="retro-taskbar d-flex align-items-center gap-2">
    <button type="button" class="start" id="start-button" aria-haspopup="menu" aria-expanded="false">Start</button>
    <button type="button" class="task" aria-pressed="true">activity02_json</button>
    <span class="clock ms-auto" id="clock">--:--</span>
  </footer>

  <script>
    var characters = [
      {
        name: "Ineffa",
        element: "Electro",
        weapon: "Polearm",
        intro:  `Nice to meet you — I am Ineffa, a multifunctional robot for domestic application. 
        I am currently equipped with cleaning, cooking, and emotional communication modules. 
        I also have a combat module, which can only be activated after reading the 11-page liability waiver. 
        Now, how can I assist you today?` 
      }, {
        name: "Aino",
        element: "Hydro",
        weapon: "Claymore",
        intro:  `Oh! Are you here to play with me? Hee-hee, my name's Aino, and I'm an inventor! 
        Me and Ineffa live together. I could probably eat all the cakes and cookies in the world, 
        because I love them sooo much. But my favorite kind of all is Lakkaberry Krumkake! 
        Come visit my Clink-Clank Krumkake Craftshop whenever you want! Anyway, that's me — what about you? 
        Tell me something about you, then we'll be friends!` 
      }, {
        name: "Lauma",
        element: "Dendro",
        weapon: "Catalyst",
        intro:  `Open your eyes. My name is Lauma, and here in the stillness of these woods, 
        the light of the frost moon shines down generously on all. 
        The gaze of the heavens will fall on you wherever you go. Now, close your eyes... you are no longer lost.` 
      }, {
        name: "Flins",
        element: "Electro",
        weapon: "Polearm",
        intro:  `Greetings, I am Kyryll Chudomirovich Flins. It is considered good etiquette to give my 
        full name when greeting important guests, but this no doubt leaves you wondering what to call 
        me on a day-to-day basis... Well, in the past, I was customarily addressed as "Chudomirovich" 
        by most — but for simplicity's sake, you can just call me Flins. That's my surname.` 
      }, {
        name: "Nefer",
        element: "Dendro",
        weapon: "Catalyst",
        intro:  `Pleasure to meet you. I'm Nefer, head of the Curatorium of Secrets. 
        You may have heard a few rumors about me, but don't let that trouble you — fact or fiction, 
        I assure you it won't impact our collaboration.` 
      }, {
        name: "Durin",
        element: "Pyro",
        weapon: "Sword",
        intro:  `It's been a long time. I'm Durin. Everyone used to call me Mini Durin, but as you can see, 
        I'm not really "mini" anymore... Do you find my appearance strange? 
        To tell you the truth, it's still a little strange to me... I have so much to learn — 
        I hope you don't mind if I ask you for help.` 
      }, {
        name: "Jahoda",
        element: "Anemo",
        weapon: "Bow",
        intro:  `Hey, nice to meet you. If you've got a commission, spit it out. 
        As long as the pay's right, I can help you with anything... Uh, most things... 
        I can help you with most things.` 
      }, {
        name: "Columbina",
        element: "Hydro",
        weapon: "Catalyst",
        intro:  `You can call me Columbina, or Kuutar, or Moon Goddess... Whatever you prefer. 
        I'm used to having many names. The moon's blessing is yours, whenever you might find yourself in need.` 
      }, {
        name: "Illuga",
        element: "Geo",
        weapon: "Polearm",
        intro:  `Hey there! I'm Illuga, leader of the Lightkeepers' investigation squad. 
        Lost your way, huh? Heh, don't worry... that happens a lot. 
        These paths aren't exactly "traveler-friendly," even on the best of days. 
        Just follow my lead — I'll light the way ahead.` 
      }, {
        name: "Zibai",
        element: "Geo",
        weapon: "Sword",
        intro:  `My name is Zibai. I was once known to mortals as the White Horse Adeptus, 
        but now that I have descended to the mortal plane, you may simply call me Zibai.` 
      }, {
        name: "Varka",
        element: "Anemo",
        weapon: "Claymore",
        intro:  `Allow me to introduce myself again, though you're probably bored of hearing it by now. 
        I am Varka, Grand Master of the Knights of Favonius, Mondstadt's Knight of Boreas. 
        I'm here to fulfill the Favonian pledge: I swear by my sword, you shall not fall while I stand.` 
      }, {
        name: "Linnea",
        element: "Geo",
        weapon: "Bow",
        intro:  `Hey there! I'm Linnea, an advisor with the Adventurers' Guild, 
        and this little thing is my buddy, Lumi. If you've got any questions about adventuring in the wild, 
        I'm your gal! Oh yeah — and if you ever come across any strange or unusual creatures on your adventures, 
        be sure to tell me all about it!` 
      }, {
        name: "Nicole",
        element: "Pyro",
        weapon: "Catalyst",
        intro:  `Oh, should I introduce myself again? Hm, looks like no interference from Alice's 
        self-introduction magic this time, so I suppose I'll just go ahead... Ahem, I'm Nicole. 
        As you can see, I'm— Ah, again! Guess I spoke too soon...` 
      }, {
        name: "Prune",
        element: "Anemo",
        weapon: "Catalyst",
        intro:  `Hello. Prune the Witch Hunter at your service. My enemy? 
        Someone who takes pleasure in teasing children, uses other people's imaginary friends 
        to ensnare them in her schemes. Someone who's a complete show-off, way too dramatic, 
        and obsessed with wearing a hollowed-out hat. I'm referring, of course, to the wickedest 
        witch of them all! Any relevant intel on her whereabouts is more than welcome.` 
      }, {
        name: "Lohen",
        element: "Cryo",
        weapon: "Polearm",
        intro:  `Nice to meet you, I'm Lohen, Vice Captain of the 5th Company. 
        If you require assistance from the Knights of Favonius, please direct your request to headquarters. 
        But if you need something from me, I'm all ears.` 
      }, {
        name: "Sandrone",
        element: "Cryo",
        weapon: "Claymore",
        intro: `I hate self-introductions. If you're supposed to know me, you'll get to know me naturally, 
        and if you're not... why waste the time and energy? But, very well — for the sake of etiquette, 
        I'll humor you just this once... Behold, before you stands Marionette, Seventh of the Fatui Harbingers!` 
      },
    ];

    var elementColors = {
      Pyro: "tile-pink",
      Electro: "tile-lavender",
      Hydro: "tile-lilac",
      Cryo: "tile-lilac",
      Anemo: "tile-mint",
      Dendro: "tile-mint",
      Geo: "tile-cream"
    };

    var parent = document.getElementById("parent");
    var html = "";

    for (var i = 0; i < characters.length; i++) {
      var c = characters[i];
      var color = elementColors[c.element] || "tile-cream";

      html += `
        <div class="col-12 col-lg-6 p-1">
          <div class="card portrait-card h-100 ` + color + `" role="button" tabindex="0" aria-pressed="false"
               aria-label="Play ` + c.name + `'s voice line" data-name="` + c.name + `">
            <div class="portrait-bg" aria-hidden="true">
              <img class="portrait" src="assets/img/` + c.name + `_Portrait.webp" alt="" loading="lazy">
              <span class="portrait-fallback" hidden>` + c.name.charAt(0) + `</span>
              <div class="portrait-veil"></div>
            </div>
            <div class="card-body">
              <h2 class="character-name">` + c.name + `</h2>
              <div class="d-flex flex-wrap gap-2 mb-2">
                <span class="retro-badge">` + c.element + `</span>
                <span class="retro-badge">` + c.weapon + `</span>
              </div>
              <p class="mb-0">` + c.intro + `</p>
            </div>
            <span class="play-chip" aria-hidden="true">
              <span class="chip-idle">Click to listen</span>
              <span class="chip-playing">Playing...</span>
            </span>
          </div>
        </div>
      `;
    }

    parent.innerHTML = html;

    document.getElementById("count").textContent = characters.length + " object(s)";

    var portraits = parent.querySelectorAll(".portrait");
    for (var j = 0; j < portraits.length; j++) {
      var img = portraits[j];
      var showInitial = function (el) {
        el.hidden = true;
        el.nextElementSibling.hidden = false;
      };
      img.addEventListener("error", function () { showInitial(this); });
      if (img.complete && img.naturalWidth === 0) showInitial(img);
    }

    var voice = new Audio();
    voice.volume = 0.8;
    var currentCard = null;
    var statusLeft = document.getElementById("count");
    var defaultStatus = characters.length + " object(s)";
    var statusTimer = null;

    function stopVoice() {
      clearTimeout(statusTimer);
      voice.pause();
      if (currentCard) {
        currentCard.classList.remove("is-playing");
        currentCard.setAttribute("aria-pressed", "false");
      }
      currentCard = null;
      statusLeft.textContent = defaultStatus;
    }

    function failVoice() {
      if (!currentCard) return;
      var name = currentCard.dataset.name;
      stopVoice();
      statusLeft.textContent = "Can't play " + name + "'s voice line";
      statusTimer = setTimeout(function () { statusLeft.textContent = defaultStatus; }, 3500);
    }

    function playVoice(card) {
      var wasCurrent = (card === currentCard);
      stopVoice();
      if (wasCurrent) return;

      currentCard = card;
      card.classList.add("is-playing");
      card.setAttribute("aria-pressed", "true");
      statusLeft.textContent = "Playing: " + card.dataset.name + "...";

      voice.src = "assets/audio/VO_" + card.dataset.name + "_Hello.ogg";
      var started = voice.play();
      if (started && started.catch) {
        started.catch(function (err) {
          if (err && err.name === "AbortError") return;
          failVoice();
        });
      }
    }

    voice.addEventListener("ended", stopVoice);
    voice.addEventListener("error", failVoice);

    parent.addEventListener("click", function (e) {
      var card = e.target.closest(".portrait-card");
      if (card) playVoice(card);
    });

    parent.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var card = e.target.closest(".portrait-card");
      if (card && e.target === card) {
        e.preventDefault();
        playVoice(card);
      }
    });

    var appWindow = document.querySelector(".retro-window");
    new MutationObserver(function () {
      if (appWindow.hidden) stopVoice();
    }).observe(appWindow, { attributes: true, attributeFilter: ["hidden"] });

    var logo = document.querySelector(".version-logo");
    function showLogoText() {
      logo.hidden = true;
      logo.nextElementSibling.hidden = false;
    }
    logo.addEventListener("error", showLogoText);
    if (logo.complete && logo.naturalWidth === 0) showLogoText();

    // Taskbar clock
    var clock = document.getElementById("clock");
    function tick() {
      clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    tick();
    setInterval(tick, 30000);
  </script>
  <script src="../assets/js/desktop.js"></script>
</body>

</html>
