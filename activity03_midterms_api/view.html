<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character – Trailblaze Log</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="assets/img/trailblaze_log_icon.png">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="desk">
    <div id="titlebar"></div>
    <main class="hsr-window">
      <div class="content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3" style="position:relative;z-index:1">
          <a href="index.html" id="backlink" class="btn btn-sm btn-back">◂ Back to list</a>
          <div id="stepper" class="d-flex align-items-center gap-2" hidden>
            <a id="prevLink" class="btn btn-sm btn-back" href="#" aria-label="Previous character">◂ Prev</a>
            <span id="stepCount" class="small" style="min-width:64px;text-align:center"></span>
            <a id="nextLink" class="btn btn-sm btn-back" href="#" aria-label="Next character">Next ▸</a>
          </div>
        </div>
        <div class="row g-4" style="position:relative;z-index:1">
          <div class="col-lg-5 profile-col">
            <div class="card p-4 text-center" id="detail">
              <div class="spinner-border mx-auto" role="status"><span class="visually-hidden">Loading...</span></div>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="card p-4 detail" id="skills"></div>
          </div>
        </div>
      </div>
      <div class="statusbar">
        <span>Character</span>
        <div><a href="../index.html">web_dev</a><span class="sq"></span><a href="index.html">Main Menu</a><span class="sq"></span><span id="clock"></span></div>
      </div>
    </main>
    <div id="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/js/bg.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    var page = parseInt(urlParams.get('page')) || 1;
    var listUrl = "index.html?page=" + page + ["q", "el", "ra", "pa"]
      .filter(k => urlParams.get(k)).map(k => "&" + k + "=" + encodeURIComponent(urlParams.get(k))).join("");

    document.getElementById("titlebar").innerHTML = titlebarHTML(listUrl, "characters");
    document.getElementById("footer").innerHTML = FOOTER;
    document.getElementById("backlink").href = listUrl;
    startClock();

    var elDetail = document.getElementById("detail");
    var elSkills = document.getElementById("skills");
    var curChar = null, curPromo = null, allSkills = {}, skillLevel = 10, skillVersion = 1;

    // Keeps the profile sticky without a scrollbar: if the card is taller than the window,
    // let it slide up until its bottom edge is on screen, then stick.
    function fitSticky() {
      var col = document.querySelector(".profile-col");
      if (!col) return;
      if (!window.matchMedia("(min-width: 992px)").matches) { col.style.top = ""; return; }
      col.style.top = Math.min(16, window.innerHeight - col.offsetHeight - 16) + "px";
    }
    window.addEventListener("resize", fitSticky);
    window.addEventListener("load", fitSticky);

    // Prev / Next walk through the same list the person came from (same search and filters), wrapping around.
    var perPage = 10;
    function setupStepper(list, c) {
      var q = (urlParams.get('q') || '').trim().toLowerCase(), el = urlParams.get('el'), ra = urlParams.get('ra'), pa = urlParams.get('pa');
      var seq = list.filter(x =>
        (!q || String(x.id) === q || x.name.toLowerCase().includes(q)) &&
        (!el || x.element === el) && (!ra || String(x.rarity) === ra) && (!pa || x.path === pa));
      var state = ["q", "el", "ra", "pa"].filter(k => urlParams.get(k)).map(k => "&" + k + "=" + encodeURIComponent(urlParams.get(k))).join("");
      var i = seq.findIndex(x => x.id === c.id);
      if (i < 0) { seq = list; state = ""; i = seq.findIndex(x => x.id === c.id); }
      if (i < 0 || seq.length < 2) return;
      function hrefFor(j) {
        var idx = (j + seq.length) % seq.length;
        return "view.html?id=" + seq[idx].id + "&page=" + (Math.floor(idx / perPage) + 1) + state;
      }
      var prev = hrefFor(i - 1), next = hrefFor(i + 1);
      document.getElementById("prevLink").href = prev;
      document.getElementById("nextLink").href = next;
      document.getElementById("stepCount").textContent = (i + 1) + " / " + seq.length;
      document.getElementById("stepper").hidden = false;
      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ""))) return;
        if (e.key === "ArrowLeft") location.href = prev;
        else if (e.key === "ArrowRight") location.href = next;
      });
    }

    function setAscension(n) {
      document.getElementById("statsBox").innerHTML = statsInnerHTML(curPromo, curChar, n);
    }

    function renderSkills() {
      elSkills.innerHTML = skillsHTML(curChar, allSkills, skillLevel, skillVersion);
    }
    function setSkillVersion(n) { skillVersion = Number(n); renderSkills(); }
    function setSkillLevel(n) { skillLevel = Number(n); renderSkills(); }

    if (id == null) {
      elDetail.textContent = "No character selected. Go back to the list and pick one.";
      elSkills.hidden = true;
    } else {
      Promise.all([loadCharacters(), loadPromotions().catch(() => ({})), loadSkills().catch(() => ({}))]).then(([list, promos, skillData]) => {
        var c = list.find(x => String(x.id) === id);
        if (c) {
          document.title = c.name + " – Trailblaze Log";
          elDetail.innerHTML = detailHTML(c, promos[c.id], true);
          fitSticky();
          curChar = c; curPromo = promos[c.id]; allSkills = skillData; renderSkills();
          setupStepper(list, c);
        } else {
          elDetail.textContent = "Character not found.";
          elSkills.hidden = true;
        }
      }).catch(() => {
        elDetail.textContent = "Couldn't load character data. Reload the page to try again.";
      });
    }
  </script>
</body>

</html>
