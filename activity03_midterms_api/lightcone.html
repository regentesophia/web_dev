<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Cone – Trailblaze Log</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="assets/img/trailblaze_log_icon.png">
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
  <div class="desk">
    <div id="titlebar"></div>
    <main class="hsr-window">
      <div class="content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3" style="position:relative;z-index:1">
          <a href="lightcones.html" id="backlink" class="btn btn-sm btn-back">◂ Back to list</a>
          <div id="stepper" class="d-flex align-items-center gap-2" hidden>
            <a id="prevLink" class="btn btn-sm btn-back" href="#" aria-label="Previous light cone">◂ Prev</a>
            <span id="stepCount" class="small" style="min-width:64px;text-align:center"></span>
            <a id="nextLink" class="btn btn-sm btn-back" href="#" aria-label="Next light cone">Next ▸</a>
          </div>
        </div>
        <div class="row g-4" style="position:relative;z-index:1">
          <div class="col-lg-5 profile-col">
            <div class="card p-4 text-center" id="detail">
              <div class="spinner-border mx-auto" role="status"><span class="visually-hidden">Loading...</span></div>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="card p-4 detail" id="right">
              <div id="passive"></div>
              <div id="desc" class="mt-4"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="statusbar">
        <span>Light Cone</span>
        <div><a href="../index.html">web_dev</a><span class="sq"></span><a href="index.html">Main Menu</a><span class="sq"></span><span id="clock"></span></div>
      </div>
    </main>
    <div id="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/js/bg.js"></script>
  <script src="assets/js/tilt.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    var page = parseInt(urlParams.get('page')) || 1;
    var listUrl = "lightcones.html?page=" + page + ["q", "ra", "pa"]
      .filter(k => urlParams.get(k)).map(k => "&" + k + "=" + encodeURIComponent(urlParams.get(k))).join("");

    document.getElementById("titlebar").innerHTML = titlebarHTML(listUrl, "lightcones");
    document.getElementById("footer").innerHTML = FOOTER;
    document.getElementById("backlink").href = listUrl;
    startClock();

    var elDetail = document.getElementById("detail");
    var elPassive = document.getElementById("passive");
    var elDesc = document.getElementById("desc");
    var elRight = document.getElementById("right");
    var curCone = null, curPromo = null, curRank = null, superimposition = 1;

    function fitSticky() {
      var col = document.querySelector(".profile-col");
      if (!col) return;
      if (!window.matchMedia("(min-width: 992px)").matches) { col.style.top = ""; return; }
      col.style.top = Math.min(16, window.innerHeight - col.offsetHeight - 16) + "px";
    }
    window.addEventListener("resize", fitSticky);
    window.addEventListener("load", fitSticky);

    // Prev / Next walk through the same list the person came from (same search and filters), wrapping around.
    var perPage = 10;
    function setupStepper(list, l) {
      var q = (urlParams.get('q') || '').trim().toLowerCase(), ra = urlParams.get('ra'), pa = urlParams.get('pa');
      var seq = list.filter(x =>
        (!q || String(x.id) === q || x.name.toLowerCase().includes(q)) &&
        (!ra || String(x.rarity) === ra) && (!pa || x.path === pa));
      var state = ["q", "ra", "pa"].filter(k => urlParams.get(k)).map(k => "&" + k + "=" + encodeURIComponent(urlParams.get(k))).join("");
      var i = seq.findIndex(x => x.id === l.id);
      if (i < 0) { seq = list; state = ""; i = seq.findIndex(x => x.id === l.id); }
      if (i < 0 || seq.length < 2) return;
      function hrefFor(j) {
        var idx = (j + seq.length) % seq.length;
        return "lightcone.html?id=" + seq[idx].id + "&page=" + (Math.floor(idx / perPage) + 1) + state;
      }
      var prev = hrefFor(i - 1), next = hrefFor(i + 1);
      document.getElementById("prevLink").href = prev;
      document.getElementById("nextLink").href = next;
      document.getElementById("stepCount").textContent = (i + 1) + " / " + seq.length;
      document.getElementById("stepper").hidden = false;
      document.addEventListener("keydown", function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ""))) return;
        if (e.key === "ArrowLeft") location.href = prev;
        else if (e.key === "ArrowRight") location.href = next;
      });
    }

    function setAscension(n) {
      document.getElementById("statsBox").innerHTML = lcStatsInnerHTML(curPromo, n);
    }
    function renderPassive() { elPassive.innerHTML = lcPassiveHTML(curCone, curRank, superimposition); }
    function setSuperimposition(n) { superimposition = Number(n); renderPassive(); }

    if (id == null) {
      elDetail.textContent = "No light cone selected. Go back to the list and pick one.";
      elRight.hidden = true;
    } else {
      Promise.all([loadLightCones(), loadLightConePromotions().catch(() => ({})), loadLightConeRanks().catch(() => ({}))]).then(([list, promos, ranks]) => {
        var l = list.find(x => String(x.id) === id);
        if (l) {
          document.title = l.name + " – Trailblaze Log";
          curCone = l; curPromo = promos[l.id]; curRank = ranks[l.id];
          elDetail.innerHTML = lcDetailHTML(l, curPromo);
          fitSticky();
          renderPassive();
          elDesc.innerHTML = lcDescHTML(l);
          setupStepper(list, l);
        } else {
          elDetail.textContent = "Light cone not found.";
          elRight.hidden = true;
        }
      }).catch(() => {
        elDetail.textContent = "Couldn't load light cone data. Reload the page to try again.";
      });
    }
  </script>
</body>

</html>
